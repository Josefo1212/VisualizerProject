<div class="gta-container">

  <div class="sky" [style.background]="skyGradient()"></div>

  <div
    class="astro sun"
    [style.left.%]="sunX()"
    [style.top.%]="sunY()"
    [style.opacity]="sunOpacity()"
    [style.transform]="'translate(-50%, -50%) scale(' + sunScale() + ')'"
  ></div>

  <div
    class="astro moon"
    [style.left.%]="moonX()"
    [style.top.%]="moonY()"
    [style.opacity]="moonOpacity()"
  ></div>

  <div class="city-stack">
    <img
      class="city-img"
      src="/GTA/fondoGTA1.png"
      alt="Los Santos — day"
      [style.opacity]="img1Opacity()"
    />
    <img
      class="city-img"
      src="/GTA/fondoGTA2.png"
      alt="Los Santos — sunset"
      [style.opacity]="img2Opacity()"
    />
    <img
      class="city-img"
      src="/GTA/fondoGTA3.png"
      alt="Los Santos — night"
      [style.opacity]="img3Opacity()"
    />
  </div>

  <div class="content-overlay">
    <div class="time-card">
      <div class="time-icon">
        @if (isDaytime()) {
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fdb813" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        } @else {
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c0d0e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        }
      </div>

      <div class="time-display">
        <span class="time-digits">{{ hourDisplay() }}</span>
      </div>

      <div class="time-controls">
        <app-slider
          [value]="mappedHours()"
          [min]="0"
          [max]="24"
          [step]="0.1"
          [formatFn]="formatSliderHour"
          (valueChange)="onSliderChange($event)"
          (dragStart)="isDragging.set(true)"
          (dragEnd)="onDragEnd()"
        />
        @if (time.manualMode$()) {
          <button class="reset-btn" (click)="onResetTime()">⏱ REAL</button>
        }
      </div>
    </div>
  </div>

</div>
