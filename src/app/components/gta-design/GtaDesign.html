<div class="gta-container">

  <div class="sky" [style.background]="skyGradient()"></div>

  <div
    class="astro sun"
    [style.left.%]="solX()"
    [style.top.%]="solY()"
    [style.opacity]="solOpacity()"
    [style.transform]="'translate(-50%, -50%) scale(' + solScale() + ')'"
  ></div>

  <div
    class="astro moon"
    [style.left.%]="lunaX()"
    [style.top.%]="lunaY()"
    [style.opacity]="lunaOpacity()"
  ></div>

  <div class="city-layer">
    <img
      class="city"
      src="/fondoGTA.png"
      alt="Los Santos skyline"
      [style.filter]="skyFilter()"
    />

    <div class="city-lights" [style.opacity]="luzOpacity()">
      <svg class="lights-svg" width="100%" height="100%" preserveAspectRatio="xMidYMax meet">
        <defs>
          <pattern id="w1" width="50" height="40" patternUnits="userSpaceOnUse">
            <rect x="4" y="4" width="7" height="9" rx="1" fill="rgba(255,210,120,0.85)"/>
            <rect x="16" y="4" width="7" height="9" rx="1" fill="rgba(255,200,100,0.45)"/>
            <rect x="30" y="4" width="7" height="9" rx="1" fill="rgba(255,220,140,0.65)"/>
            <rect x="42" y="4" width="5" height="9" rx="1" fill="rgba(255,190,90,0.35)"/>
            <rect x="4" y="18" width="7" height="9" rx="1" fill="rgba(200,220,255,0.5)"/>
            <rect x="16" y="18" width="7" height="9" rx="1" fill="rgba(255,210,120,0.9)"/>
            <rect x="30" y="18" width="7" height="9" rx="1" fill="rgba(255,200,100,0.3)"/>
            <rect x="42" y="18" width="5" height="9" rx="1" fill="rgba(255,220,140,0.7)"/>
            <rect x="4" y="32" width="7" height="8" rx="1" fill="rgba(255,200,100,0.6)"/>
            <rect x="16" y="32" width="7" height="8" rx="1" fill="rgba(200,220,255,0.35)"/>
            <rect x="30" y="32" width="7" height="8" rx="1" fill="rgba(255,210,120,0.8)"/>
            <rect x="42" y="32" width="5" height="8" rx="1" fill="rgba(255,190,90,0.5)"/>
          </pattern>
          <pattern id="w2" width="35" height="35" patternUnits="userSpaceOnUse">
            <rect x="3" y="3" width="6" height="12" rx="1" fill="rgba(255,230,170,0.7)"/>
            <rect x="13" y="3" width="6" height="12" rx="1" fill="rgba(255,200,100,0.4)"/>
            <rect x="23" y="3" width="6" height="12" rx="1" fill="rgba(255,220,140,0.6)"/>
            <rect x="3" y="19" width="6" height="12" rx="1" fill="rgba(200,220,255,0.45)"/>
            <rect x="13" y="19" width="6" height="12" rx="1" fill="rgba(255,210,120,0.85)"/>
            <rect x="23" y="19" width="6" height="12" rx="1" fill="rgba(255,200,100,0.3)"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#w1)" />
        <rect width="100%" height="100%" fill="url(#w2)" />
      </svg>
    </div>
  </div>

  <div class="content-overlay">
    <div class="time-card">
      <div class="time-icon">
        @if (esDeDia()) {
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fdb813" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        } @else {
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c0d0e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        }
      </div>

      <div class="time-display">
        <span class="time-digits">{{ horaDisplay() }}</span>
      </div>
    </div>
  </div>

</div>
