<nav class="sidebar"
  [class.collapsed]="collapsed()"
  [class.disabled]="inactive()"
  [class.session-inactive]="!inactive() && !sessionActive()"
  [class.session-active]="sessionActive()">
  <div class="sidebar-header">
    <button class="toggle-btn" (click)="toggleCollapse()" [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
      <svg class="arrow-icon" [class.rotated]="!collapsed()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
    <span class="sidebar-title">
      <svg class="sidebar-isotype" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <polygon points="12,2 22,7 22,17 12,22 2,17 2,7" stroke="currentColor" stroke-width="1" opacity="0.5"/>
        <polygon points="12,5.5 18.5,8.8 18.5,15.2 12,18.5 5.5,15.2 5.5,8.8" stroke="currentColor" stroke-width="0.5" opacity="0.25"/>
        <circle cx="12" cy="12" r="1.5" fill="currentColor" opacity="0.8"/>
      </svg>
      GAME CENTER
    </span>
  </div>

  <div class="sidebar-divider"></div>

  @if (selectedDesign()) {
    <div class="back-item" (click)="goToDashboard()">
      <span class="back-icon">←</span>
      <span class="back-label">DASHBOARD</span>
    </div>
  }

  <div class="design-list">
    @for (d of designs; track d.id; let i = $index) {
      <app-hover-reveal
          class="design-item"
          [class.active]="d.id === selectedDesign()"
          [class.ds-btn]="d.id === 'dark-souls'"
          [style.--i]="i"
          (click)="selectDesign(d.id)"
          (mouseenter)="sessionActive() ? hoverChange.emit(d.id) : null"
          (mouseleave)="sessionActive() ? hoverChange.emit(null) : null"
          [coverImage]="d.cover ?? ''"
          [disabled]="inactive() || collapsed()"
        >
          <span class="design-icon">{{ d.icon }}</span>
          <span class="design-name">{{ d.name }}</span>
          <img [src]="d.svgIcon" [alt]="d.name" class="collapsed-svg" />
        </app-hover-reveal>
    }
  </div>

  <app-time-multiplier [disabled]="inactive() || !sessionActive()" />
</nav>
