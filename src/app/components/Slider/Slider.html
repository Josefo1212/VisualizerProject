<div class="slider-container"
  [style.--slider-fill-color]="accent"
  [style.--slider-track-color]="trackColor">
  <input
    type="range"
    class="slider-input"
    [min]="min"
    [max]="max"
    [step]="step"
    [value]="value"
    (input)="onInput($event)"
    (pointerdown)="onDragStart()"
    (pointerup)="onDragEnd()"
    (pointercancel)="onDragEnd()"
    (change)="onDragEnd()"
  />

  <div class="slider-visual" aria-hidden="true">
    <div class="slider-track">
      <div
        class="slider-fill"
        [style.width.%]="percent"
      ></div>
    </div>

    <div
      class="slider-thumb"
      [style.left.%]="percent"
    ></div>
  </div>

  <div class="slider-value">{{ displayValue }}</div>
</div>
