<nav class="sidebar" [class.collapsed]="collapsed()">
  <div class="sidebar-header">
    <button class="toggle-btn" (click)="toggle()" [attr.aria-label]="collapsed() ? 'Expandir barra' : 'Plegar barra'">
      @if (collapsed()) {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      } @else {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      }
    </button>
    @if (!collapsed()) {
      <span class="sidebar-title">DISEÑOS</span>
    }
  </div>

  <div class="sidebar-divider"></div>

  <div class="design-list">
    @if (!collapsed()) {
      <div class="design-item">
        <span class="design-icon">🗡</span>
        <span class="design-name">Diseño 1</span>
      </div>
      <div class="design-item">
        <span class="design-icon">🛡</span>
        <span class="design-name">Diseño 2</span>
      </div>
      <div class="design-item">
        <span class="design-icon">⚔</span>
        <span class="design-name">Diseño 3</span>
      </div>
    }
  </div>
</nav>
